# Exemple pedagogique : ne pas deployer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portail-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portail-demo
  template:
    metadata:
      labels:
        app: portail-demo
    spec:
      containers:
        - name: web
          image: python:3.12
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
          resources: {}
          env:
            - name: DEMO_ACCESS_MODE
              value: "training-only"
